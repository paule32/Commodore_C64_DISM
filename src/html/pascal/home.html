<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Home</title>
  <link rel="stylesheet" href="style.css">
  <script src="search_index.js"></script>
</head>
<body>
  <div class="layout">
    <aside id="tocPane" class="toc-pane">
      <div class="toc-title">Table of Contents</div>
      <ul class="treeview">
        <li>
          <div class="tree-row">
            <span class="twisty empty"></span>
            <span class="icon page-icon"></span>
            <a href="home.html">Home</a>
          </div>
        </li>
        <li>
          <div class="tree-row">
            <span class="twisty empty"></span>
            <span class="icon page-icon"></span>
            <a href="index.html#Index">Index</a>
          </div>
        </li>
        <li class="tree-node">
          <div class="tree-row tree-toggle"><span class="twisty">▸</span><span class="icon book-icon"></span><span>Units</span></div>
          <ul class="collapsed">
            <li>
              <div class="tree-row"><span class="twisty empty"></span><span class="icon page-icon"></span><a href="units.html">All Units</a></div>
            </li>
            <li>
              <div class="tree-row"><span class="twisty empty"></span><span class="icon page-icon"></span><a href="unit_Forms.html">Forms</a></div>
            </li>
            <li>
              <div class="tree-row"><span class="twisty empty"></span><span class="icon page-icon"></span><a href="unit_SysUtils.html">SysUtils</a></div>
            </li>
          </ul>
        </li>
        <li class="tree-node open">
          <div class="tree-row tree-toggle"><span class="twisty">▾</span><span class="icon book-icon"></span><span>Classes</span></div>
          <ul>
            <li class="tree-node open">
              <div class="tree-row tree-toggle"><span class="twisty">▾</span><span class="icon book-icon"></span><a href="TCustomForm.html">TCustomForm</a></div>
              <ul>
              </ul>
            </li>
            <li class="tree-node open">
              <div class="tree-row tree-toggle"><span class="twisty">▾</span><span class="icon book-icon"></span><a href="TFile.html">TFile</a></div>
              <ul>
              </ul>
            </li>
          </ul>
        </li>
      </ul>
    </aside>
    <div id="splitter" class="splitter"></div>
    <main class="page content-pane">
    <div class="doc-header-sticky">
      <div class="version">Pascal Doc</div>
      <h1>Home</h1>
      <div class="breadcrumb">
        <span>Overview</span>
      </div>
    </div>
    <section class="search-box">
      <h2>Search</h2>
      <input id="docSearchInput" type="text" placeholder="Search documentation..." autocomplete="off">
      <div id="docSearchResults" class="search-results"></div>
    </section>
    <section>
      <h1>Home</h1>
    </section>
    </main>
  </div>
<script>
    document.querySelectorAll('.tree-toggle').forEach(function(row) {
        row.addEventListener('click', function(event) {
            if (event.target.tagName.toLowerCase() === 'a') {
                return;
            }
            const li = row.closest('.tree-node');
            const ul = li.querySelector(':scope > ul');
            const twisty = row.querySelector('.twisty');
            if (!ul) {
                return;
            }
            ul.classList.toggle('collapsed');
            if (ul.classList.contains('collapsed')) {
                twisty.textContent = '▸';
            } else {
                twisty.textContent = '▾';
            }
        });
    });
    const splitter = document.getElementById('splitter');
    const tocPane = document.getElementById('tocPane');
    let dragging = false;
    splitter.addEventListener('mousedown', function(e) {
        dragging = true;
        document.body.classList.add('resizing');
    });
    document.addEventListener('mousemove', function(e) {
        if (!dragging) {
            return;
        }
        let newWidth = e.clientX;
        if (newWidth < 120) {
            newWidth = 120;
        }
        if (newWidth > 480) {
            newWidth = 480;
        }
        tocPane.style.flexBasis = newWidth + 'px';
        tocPane.style.width = newWidth + 'px';
    });
    document.addEventListener('mouseup', function() {
        dragging = false;
        document.body.classList.remove('resizing');
    });
</script>
<script>
(function() {
    const input = document.getElementById("docSearchInput");
    const results = document.getElementById("docSearchResults");

    if (!input || !results || !window.PASCAL_SEARCH_INDEX) {
        return;
    }

    function escapeHtml(text) {
        return String(text || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    input.addEventListener("input", function() {
        const query = input.value.trim().toLowerCase();
        results.innerHTML = "";

        if (query.length < 2) {
            return;
        }

        const found = window.PASCAL_SEARCH_INDEX.filter(function(item) {
            const haystack = (
                item.kind + " " +
                item.name + " " +
                (item.text || "")
            ).toLowerCase();

            return haystack.indexOf(query) >= 0;
        }).slice(0, 50);

        if (!found.length) {
            results.innerHTML = "<div class='search-empty'>No results found.</div>";
            return;
        }

        found.forEach(function(item) {
            const row = document.createElement("div");
            row.className = "search-result-item";

            row.innerHTML =
                "<div class='search-result-kind'>" + escapeHtml(item.kind) + "</div>" +
                "<div class='search-result-title'><a href='" + item.link + "'>" +
                escapeHtml(item.name) +
                "</a></div>" +
                "<div class='search-result-text'>" + escapeHtml(item.text || "") + "</div>";

            results.appendChild(row);
        });
    });
})();
</script></body>
</html>
