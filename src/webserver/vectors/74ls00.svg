<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="185" height="363" viewBox="0 0 185 363">
  <defs>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .bg{fill:#06182b}
      .pkg{fill:none;stroke:#f4f7fb;stroke-width:2.05;stroke-linejoin:round;stroke-linecap:round}
      .pin{fill:none;stroke:#f4f7fb;stroke-width:1.6}
      .num{fill:#f4f7fb;font:700 13px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
      .lblL{fill:#f4f7fb;font:700 9.8px Arial,sans-serif;text-anchor:start;dominant-baseline:middle}
      .lblR{fill:#f4f7fb;font:700 9.8px Arial,sans-serif;text-anchor:end;dominant-baseline:middle}
      .wire{fill:none;stroke:#9cfbff;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter}
      .gate{fill:#06182b;stroke:#9cfbff;stroke-width:1.9;stroke-linejoin:round}
      .bubble{fill:#06182b;stroke:#9cfbff;stroke-width:1.8}
      .title{fill:#ffd800;font:700 10px Arial,sans-serif;text-anchor:middle}
    </style>
  </defs>
  <rect class="bg" width="185" height="363"/>

  <!-- body with notch on top -->
  <path class="pkg" d="M34 6 H80 C80 15 85 21 94 21 C103 21 108 15 108 6 H154 Q158 6 158 10 V353 Q158 357 154 357 H34 Q30 357 30 353 V10 Q30 6 34 6 Z"/>

  <!-- left pins 1..7 -->
  <g>
    <rect class="pin" x="8" y="33" width="20" height="27"/><text class="num" x="18" y="46.5">1</text><text class="lblL" x="34" y="46.5">1A</text>
    <rect class="pin" x="8" y="76" width="20" height="27"/><text class="num" x="18" y="89.5">2</text><text class="lblL" x="34" y="89.5">1B</text>
    <rect class="pin" x="8" y="119" width="20" height="27"/><text class="num" x="18" y="132.5">3</text><text class="lblL" x="34" y="132.5">1Y</text>
    <rect class="pin" x="8" y="162" width="20" height="27"/><text class="num" x="18" y="175.5">4</text><text class="lblL" x="34" y="175.5">2A</text>
    <rect class="pin" x="8" y="205" width="20" height="27"/><text class="num" x="18" y="218.5">5</text><text class="lblL" x="34" y="218.5">2B</text>
    <rect class="pin" x="8" y="248" width="20" height="27"/><text class="num" x="18" y="261.5">6</text><text class="lblL" x="34" y="261.5">2Y</text>
    <rect class="pin" x="8" y="291" width="20" height="27"/><text class="num" x="18" y="304.5">7</text><text class="lblL" x="34" y="304.5">GND</text>
  </g>

  <!-- right pins 14..8 -->
  <g>
    <rect class="pin" x="158" y="33" width="20" height="27"/><text class="num" x="168" y="46.5">14</text><text class="lblR" x="152" y="46.5">VCC</text>
    <rect class="pin" x="158" y="76" width="20" height="27"/><text class="num" x="168" y="89.5">13</text><text class="lblR" x="152" y="89.5">4B</text>
    <rect class="pin" x="158" y="119" width="20" height="27"/><text class="num" x="168" y="132.5">12</text><text class="lblR" x="152" y="132.5">4A</text>
    <rect class="pin" x="158" y="162" width="20" height="27"/><text class="num" x="168" y="175.5">11</text><text class="lblR" x="152" y="175.5">4Y</text>
    <rect class="pin" x="158" y="205" width="20" height="27"/><text class="num" x="168" y="218.5">10</text><text class="lblR" x="152" y="218.5">3B</text>
    <rect class="pin" x="158" y="248" width="20" height="27"/><text class="num" x="168" y="261.5">9</text><text class="lblR" x="152" y="261.5">3A</text>
    <rect class="pin" x="158" y="291" width="20" height="27"/><text class="num" x="168" y="304.5">8</text><text class="lblR" x="152" y="304.5">3Y</text>
  </g>

  <g filter="url(#cyanGlow)">
    <!-- gate 4 top-left: 13,12 -> 11 -->
    <path class="wire" d="M158 89.5 H134 V108 H116"/>
    <path class="wire" d="M158 132.5 H128 V122 H116"/>
    <path class="gate" d="M84 99 H98 C111 99 118 105 118 115.5 C118 126 111 132 98 132 H84 Z"/>
    <circle class="bubble" cx="122.2" cy="115.5" r="3.8"/>
    <path class="wire" d="M126.2 115.5 H140 V175.5 H158"/>

    <!-- gate 3 top-right: 10,9 -> 8 -->
    <path class="wire" d="M158 218.5 H139 V211 H122"/>
    <path class="wire" d="M158 261.5 H132 V225 H122"/>
    <path class="gate" d="M92 202 H106 C119 202 126 208 126 218.5 C126 229 119 235 106 235 H92 Z"/>
    <circle class="bubble" cx="130.2" cy="218.5" r="3.8"/>
    <path class="wire" d="M134.2 218.5 H145 V304.5 H158"/>

    <!-- gate 1 bottom-left: 1,2 -> 3 -->
    <path class="wire" d="M30 46.5 H46 V243 H64"/>
    <path class="wire" d="M30 89.5 H52 V257 H64"/>
    <path class="gate" d="M64 234 H78 C91 234 98 240 98 250.5 C98 261 91 267 78 267 H64 Z"/>
    <circle class="bubble" cx="102.2" cy="250.5" r="3.8"/>
    <path class="wire" d="M106.2 250.5 H116 V132.5 H30"/>

    <!-- gate 2 bottom-right: 4,5 -> 6 -->
    <path class="wire" d="M30 175.5 H55 V275 H72"/>
    <path class="wire" d="M30 218.5 H61 V289 H72"/>
    <path class="gate" d="M72 266 H86 C99 266 106 272 106 282.5 C106 293 99 299 86 299 H72 Z"/>
    <circle class="bubble" cx="110.2" cy="282.5" r="3.8"/>
    <path class="wire" d="M114.2 282.5 H124 V261.5 H30"/>
  </g>
  <text class="title" x="94" y="343">TTL - 74LS00</text>
</svg>
