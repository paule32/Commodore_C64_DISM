name: Reusable release build

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      build_mode:
        required: true
        type: string
      runner_os:
        required: true
        type: string
      os_label:
        required: true
        type: string
      python_version:
        required: true
        type: string

permissions:
  contents: write

env:
  REQUIREMENTS_FILE: requirements.txt
  APP_NAME: d64_dism
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    runs-on: ${{ inputs.runner_os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: ${{ env.REQUIREMENTS_FILE }}

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --upgrade pip
          python -m pip install PyQt5 pyinstaller
          python -m PyInstaller --version

      - name: Show tool versions
        shell: pwsh
        run: |
          python --version
          python -m PyInstaller --version

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile src/d64_dism.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: d64_dism-${{ inputs.build_mode }}-${{ inputs.os_label }}
          path: |
            dist/d64_dism
